# Pre-commit 配置文件
# 文档：https://pre-commit.com/

repos:
  # ========== Commit Message 验证 ==========
  - repo: local
    hooks:
      - id: conventional-commits
        name: Validate Conventional Commits format
        entry: bash scripts/validate-commit-msg.sh
        language: system
        stages: [commit-msg]
        always_run: true

  # ========== Rust 代码检查 ==========
  - repo: local
    hooks:
      # 1. Rust 格式化检查
      - id: rust-fmt
        name: Check Rust code formatting
        entry: bash -c 'cd rust && cargo fmt --check'
        language: system
        files: \.rs$
        pass_filenames: false
        stages: [pre-commit]

      # 2. Rust Lint 检查
      - id: rust-clippy
        name: Run Rust linter (clippy)
        entry: bash -c 'cd rust && cargo clippy --all-targets -- -D warnings'
        language: system
        files: \.rs$
        pass_filenames: false
        stages: [pre-commit]

  # ========== 版本管理 ==========
  - repo: local
    hooks:
      # 3. 版本号自增
      - id: version-bump
        name: Bump version based on commit type
        entry: bash scripts/version-bump.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [commit-msg]

      # 4. 同步版本号到配置文件
      - id: sync-version
        name: Sync version to project files
        entry: bash -c 'bash scripts/sync-version.sh && git add VERSION rust/Cargo.toml'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

  # ========== 通用检查 ==========
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
        exclude: ^(docker-compose\.yml|\.github/)
      - id: check-added-large-files
        name: Check for large files
        args: ["--maxkb=1000"]
      - id: mixed-line-ending
        name: Check line endings
        args: ["--fix=lf"]
