[package]
name = "pencil"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }

# gRPC
tonic = { version = "0.14.1", features = ["transport"] }
tonic-prost = "0.14.1"
prost = "0.14.1"
prost-derive = "0.14.1"

# HTTP server
axum = "0.8.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "migrate"] }

# Redis
redis = { version = "1.0", features = ["tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Authentication
bcrypt = "0.17"
jsonwebtoken = { version = "10.2", default-features = false, features = ["rust_crypto"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
dotenv = "0.15"
base64 = "0.22.1"
rsa = "0.9.9"
sha2 = "0.10.9"
hex = "0.4.3"

[build-dependencies]
tonic-build = "0.14.1"
tonic-prost-build = "0.14.1"
prost-build = "0.14.1"

[dev-dependencies]
mockall = "0.14"

[[bin]]
name = "backend"
path = "src/main.rs"
