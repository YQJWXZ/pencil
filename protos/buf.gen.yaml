version: v1
managed:
  enabled: true
plugins:
  # Go code generation for gateway
  - remote: buf.build/protocolbuffers/go
    out: ../go/gateway/pb
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: ../go/gateway/pb
    opt:
      - paths=source_relative
# Note: Rust code is generated by build.rs (tonic-build), not by buf
